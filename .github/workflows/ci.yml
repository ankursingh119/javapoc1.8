# CI for common, spark-job and workflow-app (ui/ is out of scope). Card SBJ17-2, docs/cards/SBJ17-2.md.
# jdk8 is the job to make the required status check on main. jdk17 runs the same commands and may fail for now.
# Every run step is one line: scripts/ci/acceptance/AC2 and AC4 read them line by line.
# Two workflow-app tests are timing-sensitive: a rare red run is expected, and failed tests are never retried.
name: CI

on:
  push:
  pull_request:

env:
  SPARK_LOCAL_IP: 127.0.0.1

jobs:
  jdk8:
    name: JDK 8
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - run: bash scripts/ci/acceptance/AC1_workflow_runs_on_push_and_pull_request.sh
      - run: bash scripts/ci/acceptance/AC4_jdk17_job_may_fail.sh
      - run: bash scripts/ci/acceptance/AC5_tests_and_src_unchanged.sh
      - run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - run: docker compose -f docker/local/docker-compose.yml up -d hbase
      - run: bash scripts/ci/wait-for-hbase.sh 300
      - run: mvn -B install
      - run: mvn -B test
      - run: bash scripts/ci/acceptance/AC2_jdk8_job_installs_then_tests.sh
      - run: bash scripts/ci/acceptance/AC3_hbase_end_to_end_test_runs.sh
      - if: failure()
        run: docker logs --tail 300 sales-hbase
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk8
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  jdk17:
    name: JDK 17 (allowed to fail)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - run: docker compose -f docker/local/docker-compose.yml up -d hbase
      - run: bash scripts/ci/wait-for-hbase.sh 300
      - run: mvn -B install
      - run: mvn -B test
      - if: failure()
        run: docker logs --tail 300 sales-hbase
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk17
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
