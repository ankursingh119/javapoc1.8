# CI for common, spark-job and workflow-app (ui/ is out of scope). Card SBJ17-2, docs/cards/SBJ17-2.md.
# jdk8 is the job to make the required status check on main. jdk17 builds and tests common and workflow-app only
# (spark-job is built and tested on JDK 8, on Spark 3.5 and Scala 2.12 since SBJ17-11); it stays allowed to fail until a person
# makes it required.
# Every run step is one line: scripts/ci/acceptance/AC2 and AC4 read them line by line.
# AC1, AC2, AC4 and AC5 check card SBJ17-2 itself (workflow shape, src/ unchanged), so they run only on that card's
# branch and pull request; later cards that change src/ or the jobs are not held to them. AC3 (the HBase end-to-end
# test runs, not skips) is a lasting guard and runs on every build.
# Card SBJ17-8 (docs/cards/SBJ17-8.md): scripts/reference/acceptance AC1 to AC4 guard the reference reports on every
# build (AC4 runs the app on the three sample files and compares with docs/reference/); AC5 runs on that card only.
# Card SBJ17-9 (docs/cards/SBJ17-9.md): scripts/java17/acceptance AC1 to AC7. AC1, AC3 and AC4 run in the JDK 17
# job (AC4 runs the production server on JDK 17, its Spark job on JDK 8, and compares with docs/reference/); AC2, AC3
# and AC6 in the JDK 8 job; AC5 and AC7 (this card's own paths) on that card's branch and pull request only.
# Card SBJ17-11 (docs/cards/SBJ17-11.md): scripts/spark35/acceptance AC1 to AC5, all in the JDK 8 job. AC1 to AC4 are
# lasting guards (Spark 3.5 and Scala 2.12 build, reference reports and sales_agg, Java 8 class files, the local
# cluster image and the words); AC5 (this card's own paths) runs on that card's branch and pull request only.
# scripts/spark35/cluster runs the job on the local Docker Spark cluster (master and two workers) on the reference
# dates and checks sales_agg; it runs last because it empties sales_agg first.
# Card SBJ17-14 (docs/cards/SBJ17-14.md): scripts/hbase2/acceptance AC1 to AC5. AC1, AC3 and AC4 in the JDK 8 job
# (HBase 2 client and server, no HBase 1.x left, documents name today's versions); AC2 in both jobs after the runs it
# reads (JDK 8: reference compare and cluster run; JDK 17: the production server compare); AC5 (this card's own
# paths) on that card's branch and pull request only. All but AC5 are lasting guards.
# Two workflow-app tests are timing-sensitive: a rare red run is expected, and failed tests are never retried.
name: CI

on:
  push:
  pull_request:

env:
  SPARK_LOCAL_IP: 127.0.0.1

jobs:
  jdk8:
    name: JDK 8
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - if: github.ref_name == 'SBJ17-2' || github.head_ref == 'SBJ17-2'
        run: bash scripts/ci/acceptance/AC1_workflow_runs_on_push_and_pull_request.sh
      - if: github.ref_name == 'SBJ17-2' || github.head_ref == 'SBJ17-2'
        run: bash scripts/ci/acceptance/AC4_jdk17_job_may_fail.sh
      - if: github.ref_name == 'SBJ17-2' || github.head_ref == 'SBJ17-2'
        run: bash scripts/ci/acceptance/AC5_tests_and_src_unchanged.sh
      - run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - run: docker compose -f docker/local/docker-compose.yml up -d hbase
      - run: bash scripts/ci/wait-for-hbase.sh 300
      - run: mvn -B install
      - run: mvn -B test
      - if: github.ref_name == 'SBJ17-2' || github.head_ref == 'SBJ17-2'
        run: bash scripts/ci/acceptance/AC2_jdk8_job_installs_then_tests.sh
      - id: hbase_e2e
        run: bash scripts/ci/acceptance/AC3_hbase_end_to_end_test_runs.sh
      - id: reference_compare
        run: bash scripts/reference/acceptance/AC4_compare_with_reference.sh
      - if: success() || failure()
        run: bash scripts/reference/acceptance/AC1_reference_reports_committed.sh
      - if: success() || failure()
        run: bash scripts/reference/acceptance/AC2_regenerate_document.sh
      - if: success() || failure()
        run: bash scripts/reference/acceptance/AC3_bad_file_outcome_recorded.sh
      - if: (success() || failure()) && (github.ref_name == 'card/SBJ17-8-reference-reports' || github.head_ref == 'card/SBJ17-8-reference-reports')
        run: bash scripts/reference/acceptance/AC5_tests_and_src_unchanged.sh
      - if: success() || failure()
        env:
          HBASE_E2E: ${{ steps.hbase_e2e.outcome }}
          REFERENCE_COMPARE: ${{ steps.reference_compare.outcome }}
        run: bash scripts/java17/acceptance/AC2_jdk8_whole_build_passes.sh
      - if: success() || failure()
        run: bash scripts/java17/acceptance/AC3_common_targets_java8.sh
      - if: success() || failure()
        run: bash scripts/java17/acceptance/AC6_javax_kept.sh
      - if: (success() || failure()) && (github.ref_name == 'card/SBJ17-9-common-workflow-java17' || github.head_ref == 'card/SBJ17-9-common-workflow-java17')
        run: bash scripts/java17/acceptance/AC5_tests_unchanged.sh
      - if: (success() || failure()) && (github.ref_name == 'card/SBJ17-9-common-workflow-java17' || github.head_ref == 'card/SBJ17-9-common-workflow-java17')
        run: bash scripts/java17/acceptance/AC7_paths_allowed.sh
      - if: success() || failure()
        run: bash scripts/spark35/acceptance/AC1_jdk8_build_on_spark35.sh
      - if: success() || failure()
        env:
          REFERENCE_COMPARE: ${{ steps.reference_compare.outcome }}
        run: bash scripts/spark35/acceptance/AC2_reference_reports_and_sales_agg.sh
      - if: success() || failure()
        run: bash scripts/spark35/acceptance/AC3_spark_job_java8.sh
      - if: success() || failure()
        run: bash scripts/spark35/acceptance/AC4_docker_spark35_and_words.sh
      - if: (success() || failure()) && (github.ref_name == 'card/SBJ17-11-spark35-scala212' || github.head_ref == 'card/SBJ17-11-spark35-scala212')
        run: bash scripts/spark35/acceptance/AC5_paths_allowed.sh
      - if: success() || failure()
        run: bash scripts/hbase2/acceptance/AC1_jdk8_build_on_hbase2.sh
      - if: success() || failure()
        run: bash scripts/hbase2/acceptance/AC3_no_hbase1_left.sh
      - if: success() || failure()
        run: bash scripts/hbase2/acceptance/AC4_documents_name_current_versions.sh
      - if: (success() || failure()) && (github.ref_name == 'card/SBJ17-14-hbase2' || github.head_ref == 'card/SBJ17-14-hbase2')
        run: bash scripts/hbase2/acceptance/AC5_paths_allowed.sh
      - id: cluster_run
        if: success() || failure()
        run: bash scripts/spark35/cluster/run_job_on_docker_cluster.sh
      - if: success() || failure()
        env:
          AC2_JOB: jdk8
          REFERENCE_COMPARE: ${{ steps.reference_compare.outcome }}
          CLUSTER_RUN: ${{ steps.cluster_run.outcome }}
        run: bash scripts/hbase2/acceptance/AC2_reference_reports_on_hbase2.sh
      - if: failure()
        run: docker logs --tail 300 sales-hbase
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk8
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-run-jdk8
          path: target/reference-run/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark35-cluster-run
          path: target/spark35-cluster/
          if-no-files-found: ignore

  jdk17:
    name: JDK 17 (allowed to fail)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - run: docker compose -f docker/local/docker-compose.yml up -d hbase
      - run: bash scripts/ci/wait-for-hbase.sh 300
      - run: mvn -B -pl common,workflow-app -am install
      - run: mvn -B -pl common,workflow-app -am test
      - if: success() || failure()
        run: bash scripts/java17/acceptance/AC1_jdk17_build_and_tests_pass.sh
      - if: success() || failure()
        run: bash scripts/java17/acceptance/AC3_common_targets_java8.sh
      - if: success() || failure()
        run: JAVA_HOME=$JAVA_HOME_8_X64 mvn -B -pl spark-job -DskipTests package dependency:build-classpath -Dmdep.outputFile=target/local-classpath.txt
      - id: server_compare
        if: success() || failure()
        run: JAVA8_HOME=$JAVA_HOME_8_X64 bash scripts/java17/acceptance/AC4_workflow_server_on_jdk17_matches_reference.sh
      - if: success() || failure()
        env:
          AC2_JOB: jdk17
          SERVER_COMPARE: ${{ steps.server_compare.outcome }}
        run: bash scripts/hbase2/acceptance/AC2_reference_reports_on_hbase2.sh
      - if: failure()
        run: docker logs --tail 300 sales-hbase
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk17
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java17-run
          path: target/java17-run/
          if-no-files-found: ignore
