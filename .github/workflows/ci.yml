# CI for common, spark-job and workflow-app (ui/ is out of scope). Card SBJ17-2 made it; card SBJ17-17
# (docs/cards/SBJ17-17.md) left one job: "JDK 17", built and run on Java 17 only, not allowed to fail, and the job a
# person makes the required status check on main.
# Every run step is one line: the checks read them line by line.
# Lasting checks of earlier cards, all in this job on every build (the steps of checks that guarded one card's own
# branch were removed when their card was done; their scripts stay as history):
# - SBJ17-2: scripts/ci/acceptance/AC3 (the HBase end-to-end test runs, not skips).
# - SBJ17-8: scripts/reference/acceptance AC1 to AC4 (AC4 runs the app on the three sample files and compares with
#   docs/reference/).
# - SBJ17-9: scripts/java17/acceptance AC1, AC2, AC3 and AC6 (AC2 and AC3 asserted Java 8 until SBJ17-17; its AC4,
#   the server on 17 with the job on 8, is replaced by SBJ17-16's AC2).
# - SBJ17-11: scripts/spark35/acceptance AC1 to AC4; scripts/spark35/cluster runs the job on the local Docker Spark
#   cluster and checks sales_agg; it empties sales_agg first.
# - SBJ17-14: scripts/hbase2/acceptance AC1 to AC4 (AC2 after the runs it reads).
# - SBJ17-16: scripts/java17s1/acceptance AC1 to AC3 (server and job on Java 17; the cluster on a Java 17 image).
# - SBJ17-17: scripts/java17f/acceptance AC1 to AC6, the person's criteria for the Java 17 flip.
# Two workflow-app tests are timing-sensitive: a rare red run is expected, and failed tests are never retried.
name: CI

on:
  push:
  pull_request:

env:
  SPARK_LOCAL_IP: 127.0.0.1

jobs:
  jdk17:
    name: JDK 17
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - run: docker compose -f docker/local/docker-compose.yml up -d hbase
      - run: bash scripts/ci/wait-for-hbase.sh 300
      - run: mvn -B install -DskipTests
      - run: mvn -B test -fae
      - id: hbase_e2e
        if: success() || failure()
        run: bash scripts/ci/acceptance/AC3_hbase_end_to_end_test_runs.sh
      - if: success() || failure()
        run: bash scripts/java17/acceptance/AC1_jdk17_build_and_tests_pass.sh
      - if: success() || failure()
        run: bash scripts/java17s1/acceptance/AC1_jdk17_whole_build_and_tests_pass.sh
      - id: reference_compare
        if: success() || failure()
        run: bash scripts/reference/acceptance/AC4_compare_with_reference.sh
      - if: success() || failure()
        run: bash scripts/reference/acceptance/AC1_reference_reports_committed.sh
      - if: success() || failure()
        run: bash scripts/reference/acceptance/AC2_regenerate_document.sh
      - if: success() || failure()
        run: bash scripts/reference/acceptance/AC3_bad_file_outcome_recorded.sh
      - if: success() || failure()
        env:
          HBASE_E2E: ${{ steps.hbase_e2e.outcome }}
          REFERENCE_COMPARE: ${{ steps.reference_compare.outcome }}
        run: bash scripts/java17/acceptance/AC2_jdk17_whole_build_passes.sh
      - if: success() || failure()
        run: bash scripts/java17/acceptance/AC3_common_targets_java17.sh
      - if: success() || failure()
        run: bash scripts/java17/acceptance/AC6_javax_kept.sh
      - if: success() || failure()
        run: bash scripts/spark35/acceptance/AC1_jdk17_build_on_spark35.sh
      - if: success() || failure()
        env:
          REFERENCE_COMPARE: ${{ steps.reference_compare.outcome }}
        run: bash scripts/spark35/acceptance/AC2_reference_reports_and_sales_agg.sh
      - if: success() || failure()
        run: bash scripts/spark35/acceptance/AC3_spark_job_java17.sh
      - if: success() || failure()
        run: bash scripts/spark35/acceptance/AC4_docker_spark35_and_words.sh
      - if: success() || failure()
        run: bash scripts/hbase2/acceptance/AC1_jdk17_build_on_hbase2.sh
      - if: success() || failure()
        run: bash scripts/hbase2/acceptance/AC3_no_hbase1_left.sh
      - if: success() || failure()
        run: bash scripts/hbase2/acceptance/AC4_documents_name_current_versions.sh
      - id: cluster_run
        if: success() || failure()
        run: bash scripts/spark35/cluster/run_job_on_docker_cluster.sh
      - if: success() || failure()
        run: mvn -B -q -pl spark-job dependency:build-classpath -Dmdep.outputFile=target/local-classpath.txt
      - id: java17_compare
        if: success() || failure()
        run: bash scripts/java17s1/acceptance/AC2_server_and_job_on_jdk17_match_reference.sh
      - if: success() || failure()
        env:
          REFERENCE_COMPARE: ${{ steps.reference_compare.outcome }}
          CLUSTER_RUN: ${{ steps.cluster_run.outcome }}
          SERVER_COMPARE: ${{ steps.java17_compare.outcome }}
        run: bash scripts/hbase2/acceptance/AC2_reference_reports_on_hbase2.sh
      - id: java17_cluster
        if: success() || failure()
        run: bash scripts/java17s1/acceptance/AC3_cluster_on_jdk17.sh
      - if: success() || failure()
        run: bash scripts/java17f/acceptance/AC1_one_java17_job_all_tests_pass.sh
      - if: success() || failure()
        env:
          JAVA17_COMPARE: ${{ steps.java17_compare.outcome }}
          JAVA17_CLUSTER: ${{ steps.java17_cluster.outcome }}
        run: bash scripts/java17f/acceptance/AC2_reports_and_sales_agg_match_on_java17.sh
      - if: success() || failure()
        run: bash scripts/java17f/acceptance/AC3_class_files_java17.sh
      - if: success() || failure()
        run: bash scripts/java17f/acceptance/AC4_earlier_checks_run_on_java17.sh
      - if: success() || failure()
        run: bash scripts/java17f/acceptance/AC5_readme_setup_needs_only_jdk17.sh
      - if: success() || failure()
        run: bash scripts/java17f/acceptance/AC6_no_main_source_change.sh
      - if: failure()
        run: docker logs --tail 300 sales-hbase
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-run
          path: |
            target/reference-run/
            target/java17s1-run/
            target/java17f-readme/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spark35-cluster-run
          path: target/spark35-cluster/
          if-no-files-found: ignore
